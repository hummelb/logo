<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprech-Spiele</title>
<style>
  :root {
    --sky1: #e1f5fe;
    --sky2: #fffde7;
    --ink: #3e2c23;
    --hl: #e65100;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky1), var(--sky2) 75%, #e6f4c9) fixed;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 4vh, 32px);
    padding: 24px 16px;
    user-select: none; -webkit-user-select: none;
  }
  .hl { color: var(--hl); }
  h1 { margin: 0; font-size: clamp(32px, 8vw, 60px); text-align: center; }

  .games {
    display: grid; gap: clamp(16px, 4vw, 32px); width: 100%; max-width: 820px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }
  .game {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: clamp(200px, 34vh, 320px); padding: 20px;
    border-radius: 36px; text-decoration: none; color: inherit;
    background: #fff; border: 6px solid var(--c);
    box-shadow: 0 10px 0 var(--c), 0 16px 30px rgba(0,0,0,.12);
    transition: transform .1s, box-shadow .1s;
  }
  .game:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--c), 0 6px 12px rgba(0,0,0,.12); }
  .game:focus-visible { outline: 4px solid #42a5f5; outline-offset: 6px; }
  .game svg { height: clamp(100px, 18vh, 160px); width: auto; max-width: 80%; overflow: visible; animation: bob 2.2s ease-in-out infinite; }
  .game:nth-child(2) svg { animation-delay: -1.1s; }
  .game .name { font-size: clamp(30px, 7vw, 46px); font-weight: bold; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }

  .sch { --c: #8bc34a; }
  .f   { --c: #ffca28; }
  .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .09s linear infinite alternate; }
  @keyframes flap { to { transform: scaleY(.55); } }

  .parents { max-width: 560px; font-size: 14px; line-height: 1.4; text-align: center; opacity: .7; font-family: system-ui, sans-serif; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .game svg, .wing { animation: none; }
  }
</style>
</head>
<body>

<h1>Sprech-Spiele</h1>

<div class="games">
  <a class="game sch" href="sch-spiel.html" aria-label="Schlangis Sch-Spiel">
    <svg viewBox="0 0 210 140" aria-hidden="true">
      <path d="M20 112 Q50 72 80 106 T140 96" fill="none" stroke="#7cb342" stroke-width="24" stroke-linecap="round"/>
      <g fill="#558b2f"><circle cx="34" cy="98" r="4"/><circle cx="62" cy="88" r="4"/><circle cx="92" cy="112" r="4"/><circle cx="120" cy="104" r="4"/></g>
      <path d="M178 78 H196 L203 71 M196 78 L203 85" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="152" cy="74" rx="32" ry="26" fill="#8bc34a"/>
      <circle cx="140" cy="62" r="10" fill="#fff"/><circle cx="164" cy="62" r="10" fill="#fff"/>
      <circle cx="142" cy="63" r="5" fill="#212121"/><circle cx="166" cy="63" r="5" fill="#212121"/>
      <circle cx="144" cy="61" r="1.8" fill="#fff"/><circle cx="168" cy="61" r="1.8" fill="#fff"/>
      <circle cx="132" cy="80" r="5" fill="#f48fb1" opacity=".7"/><circle cx="174" cy="80" r="5" fill="#f48fb1" opacity=".7"/>
      <path d="M142 82 Q153 92 164 82" fill="none" stroke="#33691e" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span class="name"><span class="hl">Sch</span>langi</span>
  </a>

  <a class="game f" href="f-spiel.html" aria-label="Fridolins F-Spiel">
    <svg viewBox="0 -8 124 108" aria-hidden="true">
      <g transform="rotate(-15 48 30)"><ellipse class="wing" cx="48" cy="16" rx="13" ry="20" fill="#e3f6ff" stroke="#8ccbe8" stroke-width="2.5" opacity=".95"/></g>
      <g transform="rotate(15 66 30)"><ellipse class="wing" cx="66" cy="16" rx="13" ry="20" fill="#e3f6ff" stroke="#8ccbe8" stroke-width="2.5" opacity=".95" style="animation-delay:.045s"/></g>
      <path d="M44 86 l-3 9 M58 88 v9 M72 85 l3 9" stroke="#3e2c23" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M17 57 L5 60 L17 63 Z" fill="#3e2c23"/>
      <ellipse cx="52" cy="60" rx="36" ry="28" fill="#ffca28"/>
      <path d="M28 39.1 L28 80.9 Q18 76 16 60 Q18 44 28 39.1Z" fill="#fff8e1"/>
      <path d="M38 34.2 Q44 32 50 32 L50 88 Q44 88 38 85.8Z" fill="#3e2c23"/>
      <path d="M62 33.1 Q67 34.5 72 36.7 L72 83.3 Q67 85.5 62 86.9Z" fill="#3e2c23"/>
      <ellipse cx="52" cy="60" rx="36" ry="28" fill="none" stroke="#f0a500" stroke-width="3" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>
      <path d="M83 32 Q79 16 70 10 M97 31 Q103 15 112 10" fill="none" stroke="#3e2c23" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="10" r="4.5" fill="#3e2c23"/><circle cx="112" cy="10" r="4.5" fill="#3e2c23"/>
      <circle cx="90" cy="52" r="22" fill="#ffd54f"/>
      <circle cx="90" cy="52" r="22" fill="none" stroke="#f0a500" stroke-width="3" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>
      <circle cx="83" cy="48" r="7" fill="#fff"/><circle cx="99" cy="48" r="7" fill="#fff"/>
      <circle cx="85" cy="49" r="4.3" fill="#212121"/><circle cx="101" cy="49" r="4.3" fill="#212121"/>
      <circle cx="86.5" cy="47" r="1.6" fill="#fff"/><circle cx="102.5" cy="47" r="1.6" fill="#fff"/>
      <ellipse cx="78" cy="60" rx="4.5" ry="3" fill="#f48fb1" opacity=".75"/><ellipse cx="104" cy="60" rx="4.5" ry="3" fill="#f48fb1" opacity=".75"/>
      <path d="M85 61 Q91 67 97 61" fill="none" stroke="#3e2c23" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <span class="name"><span class="hl">F</span>ridolin</span>
  </a>
</div>

<p class="parents">
  Für Eltern: Schlangi übt das „Sch“ am Wortanfang (Schal statt Wal),
  Hummel Fridolin übt „F“ und „Pf“ vor einem Mitlaut (Flasche statt lasche, Pflaume statt laume).
</p>

</body>
</html>
